[package]
name = "ehviewer_core"
version = "0.0.0"
edition = "2024"

[dependencies]
regex-lite = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
quick-xml = { default-features = false, version = "0.41" }
tl = { git = "https://github.com/FooIbar/tl.git", features = ["simd"] }
log = "0.4"
serde_cbor = "0.11"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
image = { default-features = false, version = "0.25" }
rxing = { version = "0.9", default-features = false, features = ["decoders", "qrcode", "no_character_set_support"] }
libwebp-sys2 = { git = "https://github.com/FooIbar/libwebp-sys2-rs.git", features = ["1_5", "demux", "extern-types"] }

libc = "0.2"
sha1 = "0.10"
memmap2 = "0.9"

[dev-dependencies]
reqwest = "0.13"
tokio = { version = "1", features = ["macros"] }

