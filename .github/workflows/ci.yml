name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version
      - name: Native host prerequisites
        run: sudo apt-get update && sudo apt-get install -y autoconf automake pkg-config libarchive-dev libwebp-dev
      - name: Rust targets
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/rust
          shared-key: ${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'native/rust/Cargo.lock') }}
          save-if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      - name: Rust format, Core/JNI tests and Android Clippy
        working-directory: native/rust
        run: |
          cargo fmt --all -- --check
          cargo test --locked -p ehviewer_core
          cargo test --locked --features jvm --lib
          for target in aarch64-linux-android thumbv7neon-linux-androideabi x86_64-linux-android; do
            cargo clippy --locked --workspace --target "$target" --all-features -- -D warnings
          done
      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
      - name: Build and test Kotlin verification tools
        run: ./gradlew -p tools/verification check installDist --console=plain --no-daemon
      - name: Verify Kotlin boundaries and language policy
        run: tools/verification/build/install/verification/bin/verification architecture
      - name: Check, test, lint and build
        run: >-
          ./gradlew :build-logic:convention:check spotlessCheck
          :app:testDebugUnitTest
          :core:common:testAndroidHostTest :core:data:testAndroidHostTest
          :core:i18n:testAndroidHostTest :core:ui:testAndroidHostTest
          :app:lintRelease :app:assembleDebug :app:assembleDebugAndroidTest
          :app:assembleRelease :benchmark:assembleNonMinifiedRelease
          --console=plain --no-daemon
      - name: Verify APK identity, signatures, JNI, ABI and 16KB alignment
        run: |
          mkdir -p reports
          test -s app/build/outputs/mapping/release/mapping.txt
          test -s app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
          tools/verification/build/install/verification/bin/verification native-sources > reports/native-sources.json
          tools/verification/build/install/verification/bin/verification diagnostics --sdk "$ANDROID_HOME" > reports/native-diagnostics.json
          tools/verification/build/install/verification/bin/verification bytecode > reports/android-bytecode.json
          tools/verification/build/install/verification/bin/verification apks app/build/outputs/apk/release --sdk "$ANDROID_HOME" > reports/release-apks.json
          tools/verification/build/install/verification/bin/verification apks app/build/outputs/apk/debug --sdk "$ANDROID_HOME" --debug --application-id moe.tarsin.ehviewer.debug > reports/debug-apks.json
      - name: Upload ARM64
        uses: actions/upload-artifact@v7
        with:
          name: arm64-v8a-${{ github.sha }}
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk
          if-no-files-found: error
      - name: Upload ARM32
        uses: actions/upload-artifact@v7
        with:
          name: armeabi-v7a-${{ github.sha }}
          path: app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          if-no-files-found: error
      - name: Upload x86_64
        uses: actions/upload-artifact@v7
        with:
          name: x86_64-${{ github.sha }}
          path: app/build/outputs/apk/release/app-x86_64-release.apk
          if-no-files-found: error
      - name: Upload universal
        uses: actions/upload-artifact@v7
        with:
          name: universal-${{ github.sha }}
          path: app/build/outputs/apk/release/app-universal-release.apk
          if-no-files-found: error
      - name: Instrumentation inputs
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-inputs
          path: |
            app/build/outputs/apk/debug/app-universal-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
      - name: Verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports
          path: |
            reports/
            app/build/reports/
            core/*/build/reports/
          retention-days: 14

  device:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: api26
            image: system-images;android-26;google_apis;x86_64
          - label: api29
            image: system-images;android-29;google_apis;x86_64
          - label: api33
            image: system-images;android-33;google_apis;x86_64
          - label: api35
            image: system-images;android-35;google_apis;x86_64
          - label: api35-16k
            image: system-images;android-35;google_apis_ps16k;x86_64
          - label: api37-canary-16k
            image: system-images;android-canary-20261007;google_apis_ps16k;x86_64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version
      - uses: actions/download-artifact@v8
        with:
          name: instrumentation-inputs
          path: device-inputs
      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-read-only: true
      - name: Build Kotlin device runner
        run: ./gradlew -p tools/verification installDist --console=plain --no-daemon
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Run packaged Android JNI and platform tests
        env:
          TEST_IMAGE: ${{ matrix.image }}
          TEST_LABEL: ${{ matrix.label }}
        run: tools/verification/build/install/verification/bin/verification emulator
      - name: Device reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: device-${{ matrix.label }}
          path: device-reports/
          retention-days: 14
