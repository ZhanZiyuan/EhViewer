name: Releases

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag merged into main (e.g. 1.15.0)"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+(\.[0-9]+){2,3}(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::A version tag is required, for example 1.15.0 or 1.15.0-RC1."
            exit 1
          fi
          git check-ref-format "refs/tags/$RELEASE_TAG"

      - name: Free disk space
        run: rm -rf $AGENT_TOOLSDIRECTORY

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify release source
        run: |
          git merge-base --is-ancestor HEAD refs/remotes/origin/main || {
            echo "::error::The release tag must point to a commit merged into main."
            exit 1
          }

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Install Rust Toolchain
        run: rustup target add thumbv7neon-linux-androideabi

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./app/src/main/rust"

      - name: CMake Cache
        uses: actions/cache/restore@v5
        with:
          path: app/.cxx
          key: cmake-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GradleEncryptionKey }}
          cache-read-only: true

      - name: Generate Baseline Profile
        run: ./gradlew generateBaselineProfile
          -Pandroid.testoptions.manageddevices.emulator.gpu="swiftshader_indirect"
          -Prelease

      - name: Build
        run: ./gradlew assembleRelease
          -Prelease

      - name: Rename Apks
        run: |
          mv app/build/outputs/apk/default/release/app-default-universal-release.apk "EhViewer-${RELEASE_TAG}-default-universal.apk"
          mv app/build/outputs/apk/default/release/app-default-arm64-v8a-release.apk "EhViewer-${RELEASE_TAG}-default-arm64-v8a.apk"
          mv app/build/outputs/apk/default/release/app-default-x86_64-release.apk "EhViewer-${RELEASE_TAG}-default-x86_64.apk"
          mv app/build/outputs/apk/default/release/app-default-armeabi-v7a-release.apk "EhViewer-${RELEASE_TAG}-default-armeabi-v7a.apk"
          mv app/build/outputs/mapping/defaultRelease/mapping.txt "EhViewer-${RELEASE_TAG}-default-mapping.txt"
          mv app/build/outputs/native-debug-symbols/defaultRelease/native-debug-symbols.zip "EhViewer-${RELEASE_TAG}-default-native-debug-symbols.zip"

          mv app/build/outputs/apk/marshmallow/release/app-marshmallow-universal-release.apk "EhViewer-${RELEASE_TAG}-marshmallow-universal.apk"
          mv app/build/outputs/apk/marshmallow/release/app-marshmallow-arm64-v8a-release.apk "EhViewer-${RELEASE_TAG}-marshmallow-arm64-v8a.apk"
          mv app/build/outputs/apk/marshmallow/release/app-marshmallow-x86_64-release.apk "EhViewer-${RELEASE_TAG}-marshmallow-x86_64.apk"
          mv app/build/outputs/apk/marshmallow/release/app-marshmallow-armeabi-v7a-release.apk "EhViewer-${RELEASE_TAG}-marshmallow-armeabi-v7a.apk"
          mv app/build/outputs/mapping/marshmallowRelease/mapping.txt "EhViewer-${RELEASE_TAG}-marshmallow-mapping.txt"
          mv app/build/outputs/native-debug-symbols/marshmallowRelease/native-debug-symbols.zip "EhViewer-${RELEASE_TAG}-marshmallow-native-debug-symbols.zip"

      - name: Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          target_commitish: main
          body: Bump Version
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          fail_on_unmatched_files: true
          files: |
            EhViewer-${{ env.RELEASE_TAG }}-default-universal.apk
            EhViewer-${{ env.RELEASE_TAG }}-default-arm64-v8a.apk
            EhViewer-${{ env.RELEASE_TAG }}-default-x86_64.apk
            EhViewer-${{ env.RELEASE_TAG }}-default-armeabi-v7a.apk
            EhViewer-${{ env.RELEASE_TAG }}-default-mapping.txt
            EhViewer-${{ env.RELEASE_TAG }}-default-native-debug-symbols.zip

            EhViewer-${{ env.RELEASE_TAG }}-marshmallow-universal.apk
            EhViewer-${{ env.RELEASE_TAG }}-marshmallow-arm64-v8a.apk
            EhViewer-${{ env.RELEASE_TAG }}-marshmallow-x86_64.apk
            EhViewer-${{ env.RELEASE_TAG }}-marshmallow-armeabi-v7a.apk
            EhViewer-${{ env.RELEASE_TAG }}-marshmallow-mapping.txt
            EhViewer-${{ env.RELEASE_TAG }}-marshmallow-native-debug-symbols.zip
