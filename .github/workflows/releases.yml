name: Releases

permissions:
  contents: read

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag merged into main (e.g. 1.15.0)"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+(\.[0-9]+){2,3}(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::A version tag is required, for example 1.15.0 or 1.15.0-RC1."
            exit 1
          fi
          git check-ref-format "refs/tags/$RELEASE_TAG"

      - name: Free disk space
        run: rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release source
        run: |
          git merge-base --is-ancestor HEAD refs/remotes/origin/main || {
            echo "::error::The release tag must point to a commit merged into main."
            exit 1
          }

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Native host prerequisites
        run: sudo apt-get update && sudo apt-get install -y autoconf automake pkg-config

      - name: Install Rust Toolchain
        run: rustup show active-toolchain

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./app/src/main/rust"
          save-if: "false"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GradleEncryptionKey }}
          validate-wrappers: true
          cache-read-only: true

      - name: Generate Baseline Profile
        run: ./gradlew generateBaselineProfile
          -Pandroid.testoptions.manageddevices.emulator.gpu="swiftshader_indirect"
          -Prelease

      - name: Build
        run: ./gradlew assembleRelease
          -Prelease

      - name: Verify APK identity, signatures, JNI, ABI and 16KB alignment
        run: python3 scripts/verify_apks.py app/build/outputs/apk/release --sdk "$ANDROID_HOME"

      - name: Rename Apks
        run: |
          mv app/build/outputs/apk/release/app-universal-release.apk "EhViewer-${RELEASE_TAG}-universal.apk"
          mv app/build/outputs/apk/release/app-arm64-v8a-release.apk "EhViewer-${RELEASE_TAG}-arm64-v8a.apk"
          mv app/build/outputs/apk/release/app-x86_64-release.apk "EhViewer-${RELEASE_TAG}-x86_64.apk"
          mv app/build/outputs/apk/release/app-armeabi-v7a-release.apk "EhViewer-${RELEASE_TAG}-armeabi-v7a.apk"
          mv app/build/outputs/mapping/release/mapping.txt "EhViewer-${RELEASE_TAG}-mapping.txt"
          mv app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip "EhViewer-${RELEASE_TAG}-native-debug-symbols.zip"

      - name: Release payload
        uses: actions/upload-artifact@v7
        with:
          name: release-payload
          path: |
            EhViewer-${{ env.RELEASE_TAG }}-universal.apk
            EhViewer-${{ env.RELEASE_TAG }}-arm64-v8a.apk
            EhViewer-${{ env.RELEASE_TAG }}-x86_64.apk
            EhViewer-${{ env.RELEASE_TAG }}-armeabi-v7a.apk
            EhViewer-${{ env.RELEASE_TAG }}-mapping.txt
            EhViewer-${{ env.RELEASE_TAG }}-native-debug-symbols.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-payload
      - name: Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          target_commitish: main
          body: Bump Version
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          fail_on_unmatched_files: true
          files: |
            EhViewer-${{ env.RELEASE_TAG }}-universal.apk
            EhViewer-${{ env.RELEASE_TAG }}-arm64-v8a.apk
            EhViewer-${{ env.RELEASE_TAG }}-x86_64.apk
            EhViewer-${{ env.RELEASE_TAG }}-armeabi-v7a.apk
            EhViewer-${{ env.RELEASE_TAG }}-mapping.txt
            EhViewer-${{ env.RELEASE_TAG }}-native-debug-symbols.zip
