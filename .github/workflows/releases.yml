name: Release dry run

# Publication is deliberately disabled until private retention and distribution rights
# are approved. A tag push cannot publish or even trigger this workflow.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag merged into main (e.g. v1.15.2)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Validate version tag syntax
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::A version tag such as v1.15.2 is required."
            exit 1
          fi
          release_tag_lower=$(printf '%s' "$RELEASE_TAG" | tr '[:upper:]' '[:lower:]')
          case "$release_tag_lower" in
            *snapshot*|*default*|*marshmallow*)
              echo "::error::Snapshot and flavor tags are forbidden."
              exit 1
              ;;
          esac
          git check-ref-format "refs/tags/$RELEASE_TAG"
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag is merged into main
        run: |
          git merge-base --is-ancestor HEAD refs/remotes/origin/main || {
            echo "::error::The release tag must point to a commit merged into main."
            exit 1
          }
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version
      - name: Native prerequisites
        run: sudo apt-get update && sudo apt-get install -y autoconf automake pkg-config
      - name: Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/rust
          save-if: "false"
      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-read-only: true
      - name: Build signed release and diagnostics
        run: ./gradlew :app:assembleRelease -Prelease --console=plain --no-daemon
      - name: Verify packaging regression tests
        run: |
          ./gradlew -p tools/verification check installDist --console=plain --no-daemon
          tools/verification/build/install/verification/bin/verification release-input-tests --sdk "$ANDROID_HOME"
      - name: Prepare exactly four APK attachments
        run: >-
          tools/verification/build/install/verification/bin/verification prepare-release --tag "$RELEASE_TAG"
          --sdk "$ANDROID_HOME" --output release-dry-run/apks
          --private-dir "$RUNNER_TEMP/private-release" --retention-days 180
      - name: Upload APK dry-run payload only
        uses: actions/upload-artifact@v7
        with:
          name: release-apks-dry-run
          path: |
            release-dry-run/apks/EhViewer-*-arm64-v8a.apk
            release-dry-run/apks/EhViewer-*-armeabi-v7a.apk
            release-dry-run/apks/EhViewer-*-universal.apk
            release-dry-run/apks/EhViewer-*-x86_64.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload checksum manifest
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run-manifest
          path: release-dry-run/release-manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Report publication gate
        run: |
          echo "Dry run only: no GitHub Release is created."
          echo "Runner-local diagnostics are temporary; durable private retention is not configured."
          echo "Maintain an owner-only local copy before any future publication."
