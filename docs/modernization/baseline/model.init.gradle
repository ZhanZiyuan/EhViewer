gradle.projectsEvaluated {
    rootProject.tasks.register('p0BuildModel') {
        doLast {
            println('P0_RUNTIME_JAVA=' + System.getProperty('java.version'))
            rootProject.allprojects.each { p ->
                def android = p.extensions.findByName('android')
                if (android != null && p.path == ':app') {
                    println('P0_ANDROID=' + p.path + ' compile=' + android.compileSdk + ' min=' + android.defaultConfig.minSdk + ' target=' + android.defaultConfig.targetSdk)
                    println('P0_JAVA=' + p.path + ' source=' + android.compileOptions.sourceCompatibility + ' target=' + android.compileOptions.targetCompatibility)
                    android.productFlavors.each { f -> println('P0_FLAVOR=' + f.name + ' min=' + f.minSdk + ' suffix=' + f.applicationIdSuffix) }
                }
                p.tasks.matching { it.name in ['compileDefaultDebugKotlin', 'compileDefaultReleaseKotlin', 'compileAndroidMain', 'compileDefaultDebugJavaWithJavac'] }.each { t ->
                    if (t.hasProperty('compilerOptions') && t.compilerOptions.hasProperty('jvmTarget')) {
                        println('P0_KOTLIN=' + t.path + ' jvmTarget=' + t.compilerOptions.jvmTarget.orNull)
                    }
                    if (t.hasProperty('targetCompatibility')) println('P0_JAVAC=' + t.path + ' target=' + t.targetCompatibility)
                }
            }
        }
    }
}
